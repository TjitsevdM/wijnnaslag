<title>Wijnnaslag · opzoekboek voor de wijnkenner</title>
<style>
:root{
  --bg:#FAF6EF; --surface:#FFFFFF; --ink:#231B18; --muted:#5B4F49; --line:#CDBFB1;
  --accent:#7A1F3D; --accent-dark:#531329; --accent-ink:#FFFFFF; --accent-soft:#F6E9ED;
  --focus:#1F5FBF; --mark:#FFE08A; --note:#F3E9D8; --ok:#1F6B3A; --bad:#9B2226;
  --r:14px; --gut:16px; --hh:0px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{font-size:19px;-webkit-text-size-adjust:100%}
@media (min-width:600px){html{font-size:20px}}
html[data-size="1"]{font-size:23px}
html[data-size="2"]{font-size:27px}
html[data-size="1"],html[data-size="2"]{}
body{overflow-wrap:break-word;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
a{color:var(--accent)}
:focus-visible{outline:4px solid var(--focus);outline-offset:2px;border-radius:6px}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}

/* knoppen */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3rem;padding:.55rem 1.1rem;
  border:2px solid var(--accent);border-radius:12px;background:#fff;color:var(--accent);font-weight:700;text-decoration:none;
  box-shadow:0 3px 0 var(--accent-dark);position:relative;line-height:1.2}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-dark)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:2.75rem;padding:.4rem .8rem;font-size:.9rem}
.btn[aria-pressed="true"]{background:var(--accent-soft)}
.btn svg{width:1.25em;height:1.25em;flex:none}

/* bovenbalk */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;padding:.7rem var(--gut) .2rem}
.brand{font-family:var(--serif);font-size:1.5rem;font-weight:700;color:var(--accent-dark);margin-right:auto;text-decoration:none}
.brand small{display:block;font-family:var(--sans);font-size:.7rem;font-weight:500;color:var(--muted);letter-spacing:.02em}
.tools{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.sizectl{display:flex;gap:.4rem;align-items:center}
.sizectl .lbl{font-size:.8rem;color:var(--muted);font-weight:600}
.searchbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:.5rem var(--gut) .7rem;border-bottom:2px solid var(--line)}
.searchbar form{display:flex;flex-wrap:wrap;gap:.5rem;align-items:stretch}
.field{flex:1 1 13rem;min-width:0;position:relative;display:flex}
.field input{flex:1;min-width:0;width:100%;height:3.6rem;font:inherit;font-size:1.15rem;padding:.4rem 3.4rem .4rem 1rem;border:3px solid var(--accent);border-radius:12px;background:#fff;color:var(--ink);box-shadow:inset 0 2px 3px rgba(0,0,0,.08)}
.field input::placeholder{color:#6B5F58;opacity:1}
.field .clear{position:absolute;right:.35rem;top:50%;transform:translateY(-50%);height:2.6rem;min-width:2.6rem;border:2px solid var(--line);background:#fff;border-radius:10px;font-weight:700;color:var(--muted);display:none}
.field.has .clear{display:block}
.searchbar .go{flex:0 0 auto;min-width:6.4rem;font-size:1.1rem;min-height:3.6rem}

/* indeling */
.panes{display:block}
.left,.right{padding:var(--gut)}
.hidden{display:none!important}
@media (min-width:1000px){
  body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  .searchbar{position:static}
  .panes{flex:1;min-height:0;display:grid;grid-template-columns:minmax(21rem,34%) 1fr}
  .left{overflow:auto;border-right:2px solid var(--line);background:#F4EEE3}
  .right{overflow:auto}
  .backbtn{display:none!important}
}
@media (max-width:999px){
  .has-right .left{display:none}
  .no-right .right{display:none}
}

/* startpagina */
h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0}
.lede{color:var(--muted);margin:.2rem 0 1rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(14rem,100%),1fr));gap:.8rem;margin:.4rem 0 1.2rem}
@media (min-width:1000px){.tiles{grid-template-columns:1fr 1fr}}
.tile{min-width:0;display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:var(--r);
  padding:.8rem .9rem;box-shadow:0 3px 0 var(--line);min-height:5.2rem}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tile b{display:block;font-family:var(--serif);font-size:1.15rem;color:var(--accent-dark)}
.tile span{display:block;font-size:.85rem;color:var(--muted);margin-top:.15rem}
.tile .n{display:inline-block;background:var(--accent-soft);color:var(--accent-dark);border-radius:999px;padding:0 .55rem;font-size:.8rem;font-weight:700;margin-left:.3rem}
.sec{font-size:1rem;font-family:var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:1.2rem 0 .5rem;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.3rem 0 .8rem;padding:0;list-style:none}
.chip{display:inline-flex;align-items:center;min-height:2.75rem;padding:.3rem .9rem;border:2px solid var(--accent);border-radius:999px;background:#fff;color:var(--accent);font-weight:600;text-decoration:none;box-shadow:0 2px 0 var(--accent-dark);font-size:.95rem}
.chip[aria-pressed="true"],.chip.on{background:var(--accent);color:#fff}
.help{background:var(--surface);border:2px dashed var(--line);border-radius:var(--r);padding:.7rem .9rem;margin:.8rem 0;font-size:.95rem}
.help ul{margin:.3rem 0 0 1.1rem;padding:0}

/* lijsten */
.rows{display:flex;flex-direction:column;gap:.55rem;margin:.3rem 0 1rem}
.row{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:.6rem .8rem;min-height:3.8rem;box-shadow:0 2px 0 var(--line)}
.row:active{transform:translateY(1px)}
.row[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 2px 0 var(--accent)}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-size:1.05rem}
.row .rt small{display:block;color:var(--muted);font-size:.85rem}
.row .snip{display:block;font-size:.9rem;margin-top:.2rem;color:#3B2F2A}
.row .chev{font-size:1.6rem;color:var(--accent);font-weight:700;flex:none}
mark{background:var(--mark);color:inherit;padding:0 .1em;border-radius:3px}
.dot{width:1rem;height:1rem;border-radius:50%;flex:none;border:2px solid #3B2F2A;background:#ddd}
.dot.wit{background:#F1E7A6}.dot.rood{background:#7A1F3D}.dot.rose{background:#EFA6AE}.dot.bubbels{background:#F6F0C9;background-image:radial-gradient(#C9B24A 1.5px,transparent 2px);background-size:6px 6px}
.dot.oranje{background:#E08A2E}.dot.zoet{background:#E5B642}.dot.versterkt{background:#8A4B1F}.dot.gemengd{background:linear-gradient(90deg,#F1E7A6 50%,#7A1F3D 50%)}.dot.neutraal{background:#fff}
.landh{font-family:var(--sans);font-size:.95rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-dark);margin:1rem 0 .4rem;font-weight:700;border-bottom:2px solid var(--line);padding-bottom:.2rem}
.count{font-weight:700;margin:.2rem 0 .5rem}
.notice{background:#FFF4D6;border:2px solid #D9B65A;border-radius:12px;padding:.6rem .8rem;margin:.5rem 0}

/* detailkaart */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:var(--gut);max-width:56rem}
.card h1{font-size:2rem;color:var(--accent-dark)}
.sub{color:var(--muted);margin:.2rem 0 .3rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.pron{margin:.2rem 0 .7rem;font-size:1.05rem}
.pron b{letter-spacing:.02em}
.pron small{color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:.8rem}
.kort{background:var(--accent-soft);border-left:8px solid var(--accent);border-radius:8px;padding:.7rem .9rem;margin:.6rem 0 1rem;font-size:1.05rem;font-weight:600}
.intro{margin:.4rem 0 1rem}
.fld{margin:1.1rem 0;padding-top:.8rem;border-top:2px solid #E7DDD0}
.fld h2{font-size:1.15rem;color:var(--accent-dark);margin-bottom:.3rem}
.fld p{margin:.2rem 0}
dl.kv{margin:.2rem 0}
dl.kv>div{display:grid;grid-template-columns:minmax(8rem,30%) 1fr;gap:.2rem .9rem;padding:.45rem 0;border-bottom:1px solid #E7DDD0}
dl.kv>div:last-child{border-bottom:0}
dl.kv dt{font-weight:700}
dl.kv dd{margin:0}
@media (max-width:620px){dl.kv>div{grid-template-columns:1fr}}
.note{margin-top:1.2rem;background:var(--note);border-radius:var(--r);padding:.8rem}
.note label{font-weight:700;display:block;margin-bottom:.3rem}
.note textarea{width:100%;min-height:5.5rem;font:inherit;padding:.6rem;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.note .st{font-size:.85rem;color:var(--muted);min-height:1.2em}
.related{margin-top:1.2rem}
.pending{color:var(--muted)}

/* winkels */
.shopmeta{margin:.3rem 0}
.hours{width:100%;max-width:26rem;border-collapse:collapse;margin:.4rem 0}
.hours td{padding:.35rem .5rem;border-bottom:1px solid #E7DDD0}
.hours tr.today td{background:var(--accent-soft);font-weight:800}
.hours td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.open{display:inline-block;border-radius:8px;padding:.1rem .6rem;font-weight:800;border:2px solid}
.open.y{color:var(--ok);border-color:var(--ok)}
.open.n{color:var(--bad);border-color:var(--bad)}
.tel{font-size:1.15rem;font-weight:700;letter-spacing:.02em}

.placeholder{max-width:46rem}
.foot{margin:1.5rem 0 .5rem;font-size:.9rem;color:var(--muted)}
.over h2{margin:1.2rem 0 .3rem;font-size:1.2rem}
.over p,.over li{margin:.3rem 0}

/* ===== verfijning ===== */
:root{--bg:#F5F4F0;--line:#D9D5CB;--accent:#6B1D35;--accent-dark:#4A1225;--accent-soft:#F4EAED;--r:12px;--gut:18px}
html{font-size:21px}
@media (min-width:600px){html{font-size:21px}}
html[data-size="0"]{font-size:17px}
html[data-size="1"]{font-size:19px}
html[data-size="2"]{font-size:21px}
html[data-size="3"]{font-size:24px}
html[data-size="4"]{font-size:28px}
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:.7rem var(--gut);display:grid;grid-template-columns:1fr auto;gap:.6rem .9rem;align-items:center;position:sticky;top:0;z-index:20}
.brand{grid-column:1;margin:0;line-height:1.1}
.tools{grid-column:2;display:flex;align-items:center;gap:.6rem}
.top form{grid-column:1/-1;display:flex;gap:.5rem;align-items:stretch;flex-wrap:nowrap}
@media (max-width:640px){.brand small{display:none}.sizectl .lbl{display:none}.brand{font-size:1.25rem}.tools{flex-wrap:wrap;justify-content:flex-end;min-width:0;gap:.4rem}.top{grid-template-columns:auto 1fr}}
@media (min-width:1000px){
  .top{position:static;grid-template-columns:auto minmax(20rem,1fr) auto;padding:.75rem var(--gut)}
  .top form{grid-column:2;grid-row:1}.brand{grid-column:1;grid-row:1}.tools{grid-column:3;grid-row:1}
}
.field{flex:1 1 auto;min-width:0}
.field input{height:auto;min-height:3.3rem;padding:.7rem 3.6rem .7rem 1rem;line-height:1.3;-webkit-appearance:none;appearance:none;font-size:1.05rem;border:2px solid var(--accent);border-radius:10px;box-shadow:none}
.field input::-webkit-search-cancel-button,.field input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.top .go{flex:0 0 auto;min-width:0;min-height:3.3rem;font-size:1.05rem;padding:.55rem 1.2rem}
.btn{border-width:1.5px;border-radius:10px;box-shadow:0 1px 2px rgba(35,27,24,.14);font-weight:600}
.btn:active{transform:none;background:var(--accent-soft);box-shadow:none}
.btn.pri:active{background:var(--accent-dark);color:#fff}
.btn[aria-disabled="true"]{opacity:.4}
.chip{border-width:1.5px;box-shadow:none}
.tile{border:1px solid var(--line);box-shadow:0 1px 2px rgba(35,27,24,.08);min-height:4.4rem;position:relative;padding-right:2rem}
.tile::after{content:"›";position:absolute;right:.8rem;top:50%;transform:translateY(-50%);color:var(--accent);font-size:1.5rem;font-weight:700}
.tile:active{background:var(--accent-soft);transform:none;box-shadow:none}
.tile b{font-size:1.1rem}
.row{border:1px solid var(--line);box-shadow:0 1px 2px rgba(35,27,24,.08)}
.row:active{background:var(--accent-soft);transform:none}
.row[aria-current="true"]{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.card{border:1px solid var(--line);box-shadow:0 1px 3px rgba(35,27,24,.08)}
.left{background:#EFEDE7}
.sec{margin:1.3rem 0 .5rem;font-size:.8rem;letter-spacing:.1em}
.tiles{margin:.2rem 0 .6rem}
.fld{border-top:1px solid #E6E2D8}
.kort{border-left-width:5px}

/* zoekveld: tekst nooit afgesneden */
.field input{height:3.6rem;min-height:3.6rem;padding:0 3.6rem 0 1rem;line-height:normal;font-size:1.1rem;text-overflow:clip}
.field input::placeholder{font-size:1.1rem;line-height:normal;opacity:1;color:#5B4F49;text-overflow:clip}
.top .go{min-height:3.6rem;padding:0 1rem}
@media (max-width:480px){.top .go{font-size:0}.top .go svg{width:1.6rem;height:1.6rem}.top .go{min-width:3.6rem}}

.field:not(.has) input{padding-right:1rem}
@media (max-width:640px){
  .top .btn.sm{padding:.3rem .65rem;font-size:.85rem;min-height:2.6rem}
  .tools{flex-wrap:nowrap}
  .brand{font-size:1.2rem}
}
@media (max-width:640px){
  html[data-size="3"] .top form,html[data-size="4"] .top form{flex-wrap:wrap}
  html[data-size="3"] .field,html[data-size="4"] .field{flex:1 1 100%}
  html[data-size="3"] .top .go,html[data-size="4"] .top .go{flex:1 1 100%;font-size:1.05rem}
  html[data-size="3"] .tools,html[data-size="4"] .tools{flex-wrap:wrap}
}
.btn{white-space:nowrap}
@media (max-width:640px){.top .btn.sm{padding:.3rem .5rem}.brand{font-size:1.1rem}}
</style>

function flat(v){

/* ---------- zoeken ---------- */
function norm(str){
  var s="",map=[],i,c,n,j;
  for(i=0;i<str.length;i++){
    c=str[i];
    n=c==="ß"?"ss":c==="œ"?"oe":c==="Œ"?"oe":c==="æ"?"ae":c==="ø"?"o":c.normalize("NFD").replace(/[̀-ͯ]/g,"");
    n=n.toLowerCase();
    if(!n){n=" "}
    for(j=0;j<n.length;j++){
      var ch=n[j];
      if(!/[a-z0-9]/.test(ch))ch=" ";
      s+=ch;map.push(i);
    }
  }
  return {s:s,map:map};
}
var DOCS=[],VOCAB={};
function buildIndex(){
  ALL.forEach(function(e){
    var d={e:e,fields:[]},tn=norm(e.n).s,kw=[e.q||"",e.syn||"",e.aka||"",e.u||"",e.stad||"",e.tag||"",e.land||"",e.type==="druif"?"druif rassen":"",e.type==="streek"?"streek wijnstreek appellatie":"",e.k&&KLEUR[e.k]?KLEUR[e.k]:"",e.c?CATNAME[e.c]||"":"",e.type==="winkel"?"winkel wijnwinkel":""].join(" ");
    d.title=" "+tn+" ";
    d.kw=" "+norm(kw).s+" ";
    var fl=fieldsOf(e);
    if(e.in)fl.unshift({key:"in",label:"",kw:"",val:e.in});
    if(e.s)fl.unshift({key:"s",label:"Kort",kw:"",val:e.s});
    if(e.type==="winkel"){fl.push({key:"uren",label:"Openingstijden",kw:"openingstijden uren open dicht geopend",val:e.hours.join(" ")})}
    fl.forEach(function(f){
      var txt=flat(f.val),nn=norm(txt);
      d.fields.push({label:f.label,txt:txt,ns:nn.s,map:nn.map,kw:" "+norm(f.kw).s+" ",key:f.key});
    });
    d.all=d.title+d.kw+d.fields.map(function(f){return f.ns+f.kw}).join(" ");
    d.all.split(/\s+/).forEach(function(w){if(w.length>=4)VOCAB[w]=(VOCAB[w]||0)+1});
    DOCS.push(d);
  });
}
function lev(a,b){
  var m=a.length,n=b.length,i,j,prev,cur,t;
  if(Math.abs(m-n)>2)return 9;
  prev=[];for(j=0;j<=n;j++)prev[j]=j;
  for(i=1;i<=m;i++){cur=[i];for(j=1;j<=n;j++){t=a[i-1]===b[j-1]?0:1;cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+t)}prev=cur}
  return prev[n];
}
var STOP={de:1,du:1,la:1,le:1,les:1,van:1,het:1,een:1,en:1,of:1,des:1,di:1,del:1,von:1,der:1,die:1,das:1,the:1,da:1,dos:1,d:1,l:1};
function parseQuery(q){
  var toks=norm(q).s.split(/\s+/).filter(Boolean);
  var sig=toks.filter(function(t){return !STOP[t]});
  if(sig.length)toks=sig;
  var fuzzy=[],alts=toks.map(function(t){
    if(t.length>=5&&!DOCS.some(function(d){return d.all.indexOf(t)>=0})){
      var c=[],w;
      for(w in VOCAB){var dd=lev(t,w);if(dd<=2)c.push([dd,-VOCAB[w],w])}
      c.sort(function(a,b){return a[0]-b[0]||a[1]-b[1]});
      c=c.slice(0,3).map(function(x){return x[2]});
      if(c.length){fuzzy.push([t,c[0]]);return c}
    }
    return [t];
  });
  alts=alts.map(function(al){var out=al.slice();al.forEach(function(t){if(/uur$/.test(t)&&t.length>4)out.push(t.slice(0,-3)+"ur");if(/ur$/.test(t)&&t.length>4&&!/uur$/.test(t))out.push(t.slice(0,-2)+"uur")});return out});
  return {toks:toks,alts:alts,fuzzy:fuzzy};
}
function hasW(h,a){return a.length<=2?h.indexOf(" "+a+" ")>=0:h.indexOf(a)>=0}
function search(q){
  var P=parseQuery(q),res=[];
  if(!P.toks.length)return {res:res,P:P};
  DOCS.forEach(function(d){
    var total=0,ok=true,ti;
    for(ti=0;ti<P.alts.length&&ok;ti++){
      var best=0,al=P.alts[ti],ai,fi;
      for(ai=0;ai<al.length;ai++){
        var a=al[ai];
        if(d.title.indexOf(" "+a)>=0&&(a.length>2||d.title.indexOf(" "+a+" ")>=0))best=Math.max(best,100);
        else if(hasW(d.title,a))best=Math.max(best,70);
        if(d.kw.indexOf(" "+a)>=0)best=Math.max(best,50);
        else if(hasW(d.kw,a))best=Math.max(best,40);
        for(fi=0;fi<d.fields.length;fi++){
          var f=d.fields[fi];
          if(hasW(f.ns,a)||hasW(f.kw,a))best=Math.max(best,f.ns.indexOf(" "+a)>=0||f.kw.indexOf(" "+a)>=0?16:12);
        }
      }
      if(!best)ok=false;else total+=best;
    }
    if(!ok)return;
    var nq=P.toks.join(" ");
    if(d.title.trim()===nq)total+=300;
    res.push({d:d,score:total});
  });
  res.sort(function(a,b){return b.score-a.score||a.d.e.n.localeCompare(b.d.e.n,"nl")});
  return {res:res,P:P};
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function snippet(d,P){
  var flat_alts=[].concat.apply([],P.alts),best=null,bs=-1,i,k;
  var inTitle=P.alts.map(function(al){return al.some(function(a){return d.title.indexOf(a)>=0})});
  var useAll=inTitle.every(function(x){return x});
  for(i=0;i<d.fields.length;i++){
    var f=d.fields[i];
    if(f.key==="s"||f.key==="in"&&false)continue;
    var sc=0;
    for(k=0;k<P.alts.length;k++){
      if(!useAll&&inTitle[k])continue;
      var hit=P.alts[k].some(function(a){return f.ns.indexOf(a)>=0});
      var hk=P.alts[k].some(function(a){return f.kw.indexOf(a)>=0});
      if(hit)sc+=3;else if(hk)sc+=1;
    }
    if(sc>bs){bs=sc;best=f}
  }
  if(!best||bs<=0)return "";
  var pos=-1;
  for(i=0;i<flat_alts.length;i++){var p=best.ns.indexOf(flat_alts[i]);if(p>=0&&(pos<0||p<pos))pos=p}
  var oStart=pos<0?0:best.map[pos],start=Math.max(0,oStart-45);
  if(start>0){var sp=best.txt.indexOf(" ",start);if(sp>=0&&sp<oStart)start=sp+1}
  var end=Math.min(best.txt.length,start+170);
  var ranges=[];
  flat_alts.forEach(function(a){
    if(!a)return;
    var from=0,p2;
    while((p2=best.ns.indexOf(a,from))>=0){
      var s0=best.map[p2],e0=best.map[Math.min(p2+a.length-1,best.map.length-1)]+1;
      if(s0>=start&&e0<=end)ranges.push([s0,e0]);
      from=p2+a.length;
    }
  });
  ranges.sort(function(x,y){return x[0]-y[0]});
  var out="",cur=start;
  ranges.forEach(function(r){
    if(r[0]<cur)return;
    out+=esc(best.txt.slice(cur,r[0]))+"<mark>"+esc(best.txt.slice(r[0],r[1]))+"</mark>";cur=r[1];
  });
  out+=esc(best.txt.slice(cur,end));
  return (best.label?"<b>"+esc(best.label)+":</b> ":"")+(start>0?"… ":"")+out+(end<best.txt.length?" …":"");
}

  '<h2>Wat uit algemene kennis komt</h2><p>Smaakprofielen, serveertemperaturen, rijpingsregels per streek en producentenlijsten zijn gebaseerd op algemene vakkennis en niet bij elk item afzonderlijk bijgecontroleerd. Waar cijfers kunnen schuiven, staat ‘indicatief’ erbij.</p>'+
  '<h2>Jaargangen zijn een richtlijn</h2><p>Een jaargangoordeel verschilt per bron en per producent. Een goede producent maakt ook in een zwak jaar een goede wijn.</p>'+

}

  return '<div class="placeholder"><h2 style="font-size:1.5rem">Kies links een onderwerp</h2><p class="lede">Of typ bovenin wat u zoekt en druk op <b>Zoeken</b>.</p><div class="sec">Veelgebruikt</div>'+quickHTML()+
  '<div class="help"><b>Zoektips</b><ul><li>Combineer woorden: <i>pinot noir temperatuur</i></li><li>Zoek op producent, dorp of wijngaard: <i>Raveneau</i>, <i>Cramant</i></li><li>Typfouten worden vaak vergeven: <i>chardoney</i></li></ul></div></div>';
}

/* ---------- renderen ---------- */
var lastRoute="home";
function render(){
  var r=routeOf();
  if(r.kind==="cat")S.cat=r.id;
  else if(r.kind==="home"){S.cat=null}
  var leftKey=[S.q,S.cat,S.f].join("|");
  if(leftKey!==S.lastKey||L.innerHTML===""){renderLeft();S.lastKey=leftKey}
  else{
    var cur=curId();
    [].forEach.call(L.querySelectorAll(".row"),function(a){if(cur&&a.getAttribute("href")==="#"+cur)a.setAttribute("aria-current","true");else a.removeAttribute("aria-current")});
  }
  var rightKinds={detail:1,lijst:1,over:1},hasRight=!!rightKinds[r.kind];
  if(r.kind==="detail")R.innerHTML=detailHTML(BY[r.id]);
  else if(r.kind==="lijst")R.innerHTML=listPageHTML();
  else if(r.kind==="over")R.innerHTML=overHTML();
  else R.innerHTML=placeholderHTML();
  P_.className="panes "+(hasRight?"has-right":"no-right");
  var wide=window.matchMedia("(min-width:1000px)").matches;
  if(!wide){
    if(hasRight&&lastRoute==="list"){S.scroll=window.scrollY;window.scrollTo(0,0)}
    else if(!hasRight&&lastRoute==="right"){window.scrollTo(0,S.scroll||0)}
    else if(hasRight)window.scrollTo(0,0);
  }else{R.scrollTop=0}
  lastRoute=hasRight?"right":"list";
  var lb=$("listbtn"),nf=mem.fav.length;lb.textContent="Mijn lijst"+(nf?" ("+nf+")":"");
  document.title=(r.kind==="detail"?BY[r.id].n+" · ":"")+"Wijnnaslag";
}
function backHash(){return S.cat?"cat-"+S.cat:""}

/* ---------- events ---------- */
var tmr=null;
function setQuery(v,nav){
  S.q=v;S.f="alles";FIELD.classList.toggle("has",!!v);
  if(nav){
    var wide=window.matchMedia("(min-width:1000px)").matches;
    if(!wide&&routeOf().kind!=="home"&&routeOf().kind!=="cat"){location.hash="";return}
  }
  render();
}
Q.addEventListener("input",function(){clearTimeout(tmr);var v=Q.value;FIELD.classList.toggle("has",!!v);tmr=setTimeout(function(){setQuery(v,true)},150)});
$("sform").addEventListener("submit",function(ev){
  ev.preventDefault();clearTimeout(tmr);Q.blur();setQuery(Q.value,true);
  window.scrollTo(0,0);L.scrollTop=0;
});
$("clear").addEventListener("click",function(){Q.value="";setQuery("",false);Q.focus()});
function clearQ(){if(S.q){S.q="";Q.value="";FIELD.classList.remove("has");S.lastKey=""}}
document.addEventListener("click",function(ev){
  var t=ev.target.closest?ev.target.closest("a,button"):null;if(!t)return;
  if(t.id==="brand"){ev.preventDefault();clearQ();S.cat=null;go("");return}
  if(t.id==="back"||t.id==="back2"){ev.preventDefault();if(S.moved&&S.prev===backHash()&&S.prev!==location.hash.replace(/^#/,"")&&history.length>1){S.moved=false;history.back()}else go(backHash());return}
  if(t.getAttribute("data-clear")){
    clearQ();
    if(t.getAttribute("href")==="#"){ev.preventDefault();S.cat=null;go("");return}
  }
  if(t.getAttribute("data-f")){S.f=t.getAttribute("data-f");S.lastKey="";render();return}
  if(t.id==="fav"){
    var id=routeOf().id,i=mem.fav.indexOf(id);
    if(i>=0)mem.fav.splice(i,1);else mem.fav.push(id);
    save();t.setAttribute("aria-pressed",isFav(id));t.textContent=isFav(id)?"★ Bewaard in mijn lijst":"☆ Bewaar in mijn lijst";
    var lb=$("listbtn"),nf=mem.fav.length;lb.textContent="Mijn lijst"+(nf?" ("+nf+")":"");
    return;
  }
});
document.addEventListener("input",function(ev){
  if(ev.target.id==="nt"){
    var id=routeOf().id;mem.notes[id]=ev.target.value;if(!ev.target.value)delete mem.notes[id];
    save();var st=$("nst");if(st&&storeOK)st.textContent="Opgeslagen";
  }
});
window.addEventListener("hashchange",function(ev){try{S.prev=(ev.oldURL||"").split("#")[1]||""}catch(x){S.prev=null}S.moved=true;render()});
var mq=window.matchMedia("(min-width:1000px)");var onmq=function(){render()};if(mq.addEventListener)mq.addEventListener("change",onmq);else if(mq.addListener)mq.addListener(onmq);
function setSize(n){n=Math.max(0,Math.min(4,n));mem.size=n;document.documentElement.setAttribute("data-size",n);$("smaller").setAttribute("aria-disabled",n<=0);$("bigger").setAttribute("aria-disabled",n>=4);save()}
$("bigger").addEventListener("click",function(){setSize(mem.size+1)});
$("smaller").addEventListener("click",function(){setSize(mem.size-1)});

load();buildIndex();setSize(mem.size);render();
window.__wijn={search:function(q){return search(q).res.map(function(r){return r.d.e.i})},ALL:ALL,DOCS:DOCS,CATS:CATS};
})();
</script>
